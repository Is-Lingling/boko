services:
  boko:
    build: .
    container_name: boko
    restart: unless-stopped
    ports:
      - "8287:8287"
    volumes:
      # 数据库使用命名卷，数据存于服务器 Docker 存储区，彻底与项目目录解耦
      - boko_data:/app/data
      - ./index.html:/app/index.html:ro
      - ./css:/app/css:ro
      - ./js:/app/js:ro
      - ./img:/app/img:ro
    environment:
      - BOKO_PORT=8287
      - BOKO_DB_PATH=/app/data/boko.db
      - BOKO_STATIC_DIR=/app
      - BOKO_LOCAL_MODE=false

volumes:
  boko_data:

