services:
  boko:
    build: .
    container_name: boko
    restart: unless-stopped
    ports:
      - "8287:8287"
    volumes:
      - ./data:/app/data
      - ./index.html:/app/index.html:ro
      - ./css:/app/css:ro
      - ./js:/app/js:ro
      - ./img:/app/img:ro
    environment:
      - BOKO_PORT=8287
      - BOKO_DB_PATH=/app/data/boko.db
      - BOKO_STATIC_DIR=/app

  # ===== 新增 ZeroNews 服务 =====
  zeronews:
    image: docker.zeronews.cc/zeronews/zeronews:latest
    container_name: zeronews
    hostname: zeronews
    restart: always
    # 注意：ZeroNews 官方要求 host 网络模式，这里保留
    network_mode: host
    volumes:
      # 【重要】将相对路径改为绝对路径或项目内路径
      - ./zeronews_data:/etc/zeronews
    environment:
      - TZ=Asia/Shanghai
      - TOKEN=bdb0ff0196744ef4a9a3ed8cb8e37613
