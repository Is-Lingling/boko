<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - 是令令啊</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-box">
        <div class="login-box-header">
            <h1>
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="svg-icon"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <span>管理员登录</span>
            </h1>
            <p>输入账号与密码进入后台管理模式，可进行文章撰写、编辑与删改操作。</p>
        </div>
        <form id="adminLoginForm">
            <input id="adminUser" type="text" placeholder="账号" required autocomplete="username">
            <input id="adminPass" type="password" placeholder="密码" required autocomplete="current-password">
            <button type="submit">
                <span>登录控制台</span>
            </button>
        </form>
        <div style="text-align:center;">
            <a class="link-back" href="../index.html">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="svg-icon"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                <span>返回博客首页</span>
            </a>
        </div>
    </div>
    <script>
        const form = document.getElementById('adminLoginForm');
        form.addEventListener('submit', event => {
            event.preventDefault();
            const user = document.getElementById('adminUser').value.trim();
            const pass = document.getElementById('adminPass').value;
            if (user === 'admin' && pass === 'admin123') {
                localStorage.setItem('isAdmin', 'true');
                alert('登录成功，已进入管理员模式');
                window.location.href = '../index.html';
            } else {
                alert('账号或密码错误');
            }
        });
    </script>
</body>
</html>
